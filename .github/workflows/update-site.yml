name: Update site data

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install pandas numpy scipy statsmodels scikit-learn arch requests python-dotenv

      - name: Build site data
        env:
          LUNARCRUSH_API_KEY: ${{ secrets.LUNARCRUSH_API_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: |
          if [ -n "$LUNARCRUSH_API_KEY" ]; then MODE=lunarcrush; else MODE=free; fi
          echo "Running in $MODE mode"
          python build_site_data.py --mode "$MODE"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/data/site_data.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "Update site data $(date -u +%F)" && git push)
